# Pubblicazione automatica della web app e del server su Cloudflare (Worker "ledgy", database D1 "ledgy").
# A ogni push sul branch: test, poi migrazioni del database e pubblicazione. Se i test falliscono non pubblica.
# Servono due segreti del repository: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (vedi docs/DEPLOY.md).
# Tocca solo il Worker e il database "ledgy": nessun altro progetto Cloudflare.
name: Pubblica

on:
  push:
    branches: [claude/friendly-johnson-c89c0f]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: pubblica-ledgy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  pubblica:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Segreti presenti?
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Mancano CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID nei segreti del repository: pubblicazione saltata."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ok == 'true'
      - name: Punto di ripristino del database (per tornare indietro se serve)
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler d1 time-travel info ledgy
      - name: Migrazioni del database
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply ledgy --remote
      - name: Pubblicazione
        if: steps.secrets.outputs.ok == 'true'
        run: npm run deploy
      - name: Controllo del sito
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sleep 5
          curl -sf https://ledgy.tyrigi.workers.dev/api/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://ledgy.tyrigi.workers.dev/api/me)" = "401"
          echo "Sito aggiornato al commit ${GITHUB_SHA::7}"
